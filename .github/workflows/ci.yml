# Goal: Build the image for DevBoard frontend and push to dockrhub, after linting the code.
name: CI
on:
  push:
    branches: [master]
jobs:
  code-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
     
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
      
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci
      
      - name: Run linters
        uses: wearerequired/lint-action@v3
        with:
          eslint: true
          eslint_dir: frontend
          prettier: true
          prettier_dir: frontend
          
  build-and-push:
    needs: [code-lint]
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v7

      - name: Login to dockerhub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{secrets.DOCKERHUB_TOKEN }}
      - name: Docker Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/devboard-fe-master:latest
          
  
  
  

